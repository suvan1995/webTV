name: TV emulator test

on:
  workflow_run:
    workflows: ["Build APK"]
    types: [completed]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Get APK
        run: |
          git clone -q --depth 1 -b builds "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" apk

      - name: Run on Android TV emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-tv
          arch: x86
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -dns-server 8.8.8.8 -noaudio -no-boot-anim -camera-back none
          script: |
            mkdir -p results
            adb logcat -c
            adb install -r apk/WebTV.apk
            adb shell am start -n com.example.webtv/.MainActivity
            sleep 10
            adb exec-out screencap -p > results/1-setup.png
            adb shell input text "example.com"
            sleep 2
            adb shell input keyevent 66
            sleep 40
            adb exec-out screencap -p > results/2-after-url.png
            adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1 || true
            adb pull /sdcard/ui.xml results/ui-page.xml || true
            (adb shell ping -c 2 8.8.8.8; adb shell "toybox nc -z -w 5 example.com 443 && echo tcp443-ok") > results/net.txt 2>&1 || true
            adb shell dumpsys webviewupdate > results/webview.txt 2>&1 || true
            adb shell dumpsys activity activities | grep -E "mResumedActivity|topResumedActivity" > results/activity.txt || true
            adb shell input keyevent 82
            sleep 3
            adb exec-out screencap -p > results/2b-menu.png
            adb shell input keyevent 4
            sleep 2
            adb shell am force-stop com.example.webtv
            adb shell am start -n com.example.webtv/.MainActivity
            sleep 25
            adb exec-out screencap -p > results/3-relaunch.png
            adb logcat -d > results/logcat.txt
            adb logcat -d -b crash > results/crash.txt || true

      - name: Save results to the "test-results" branch
        if: always()
        run: |
          mkdir -p results && cd results
          git init -q -b test-results
          git add -A
          git -c user.name="github-actions" -c user.email="actions@github.com" commit -q -m "TV test results" --allow-empty
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" test-results
