name: TV emulator test

on:
  workflow_run:
    workflows: ["Build APK"]
    types: [completed]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Get APK
        run: |
          git clone -q --depth 1 -b builds "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" apk

      - name: Local test page
        run: |
          mkdir -p site
          cat > site/index.html <<'HTML'
          <!doctype html><html><head><title>Shields test</title>
          <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js"></script></head>
          <body style="background:#fff;font-size:40px">
          <button id="fs" style="font-size:40px" onclick="document.getElementById('player').requestFullscreen()">Fullscreen</button>
          <div id="player" style="position:relative;width:600px;height:340px;background:#123">
            <video style="width:100%;height:100%"></video>
            <div style="position:absolute;left:0;right:0;bottom:0;display:flex;gap:30px;padding:20px;background:rgba(0,0,0,.6)">
              <button onclick="console.error('CLICKED play')" style="font-size:30px">Play</button>
              <button onclick="console.error('CLICKED settings')" style="font-size:30px">Settings</button>
              <button onclick="console.error('CLICKED next')" style="font-size:30px">Next</button>
            </div>
          </div>
          <h1>Hello from the test page</h1>
          <div class="adsbygoogle" data-ad-client="ca-pub-1" style="display:block;height:90px;background:red">AD BOX SHOULD BE HIDDEN</div>
          <div id="ad_top" style="height:90px;background:orange">AD TOP SHOULD BE HIDDEN</div>
          <form><input type="email" name="email" placeholder="Email"><input type="password" name="pw">
          <label><input type="checkbox" name="remember"> Remember me</label></form>
          <p>End of page</p></body></html>
          HTML
          cd site && nohup python3 -m http.server 8000 >/dev/null 2>&1 &

      - name: Run on Android TV emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-tv
          arch: x86
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -dns-server 8.8.8.8 -noaudio -no-boot-anim -camera-back none
          script: |
            mkdir -p results
            adb logcat -c
            adb install -r apk/WebTV.apk
            adb shell am start -n com.example.webtv/.MainActivity
            sleep 10
            adb exec-out screencap -p > results/1-setup.png
            adb shell input text "http://10.0.2.2:8000/"
            sleep 2
            adb shell input keyevent 66
            sleep 40
            adb exec-out screencap -p > results/2-after-url.png
            adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1 || true
            adb pull /sdcard/ui.xml results/ui-page.xml || true
            (adb shell ping -c 2 8.8.8.8; adb shell "toybox nc -z -w 5 example.com 443 && echo tcp443-ok") > results/net.txt 2>&1 || true
            adb shell dumpsys webviewupdate > results/webview.txt 2>&1 || true
            adb shell dumpsys activity activities | grep -E "mResumedActivity|topResumedActivity" > results/activity.txt || true
            # --- fullscreen player navigation ---
            adb shell input keyevent 20; sleep 2
            adb shell input keyevent 23; sleep 4
            adb exec-out screencap -p > results/v1-fullscreen.png
            adb shell input keyevent 20; sleep 3
            adb exec-out screencap -p > results/v2-controls.png
            adb shell input keyevent 22; sleep 2
            adb exec-out screencap -p > results/v3-moved.png
            adb shell input keyevent 23; sleep 2
            adb shell input keyevent 4; sleep 2
            adb shell input keyevent --longpress 23; sleep 3
            adb exec-out screencap -p > results/v4-longpress-menu.png
            adb shell input keyevent 4; sleep 2
            adb shell input keyevent 4; sleep 2
            adb exec-out screencap -p > results/v5-after-back.png
            adb shell am force-stop com.example.webtv
            adb shell "toybox wget -q -O - http://example.com 2>&1 | head -c 200" > results/internet.txt 2>&1 || true
            adb shell am start -n com.example.webtv/.MainActivity
            sleep 25
            adb exec-out screencap -p > results/3-relaunch.png
            adb logcat -d > results/logcat.txt
            adb logcat -d -b crash > results/crash.txt || true

      - name: Save results to the "test-results" branch
        if: always()
        run: |
          mkdir -p results && cd results
          git init -q -b test-results
          git add -A
          git -c user.name="github-actions" -c user.email="actions@github.com" commit -q -m "TV test results" --allow-empty
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" test-results
