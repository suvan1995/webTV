name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk "out/WebTV-${GITHUB_RUN_NUMBER}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: WebTV-apk-${{ github.run_number }}
          path: out/*.apk

      - name: Save APK to the "builds" branch
        run: |
          cp out/*.apk /tmp/
          cd /tmp && rm -rf builds && mkdir builds && cd builds
          git init -q -b builds
          cp /tmp/WebTV-*.apk WebTV.apk
          git add WebTV.apk
          git -c user.name="github-actions" -c user.email="actions@github.com" commit -q -m "APK from run ${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" builds
